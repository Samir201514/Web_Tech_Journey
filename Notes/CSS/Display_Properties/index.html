<!DOCTYPE html>
<html lang="en">
<head>
    <title> Display Properties </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline + allows width/height -->
    <div id="div1"> Display Inline-Block </div>

    <!-- Inline: stays in same line -->
    <div id="div2"> Display Inline </div> 

    <!-- None: completely removed; effect others position -->
    <div id="div3"> Display None </div>

    <!-- Block: starts on a new line -->
    <div id="div4"> Display Block </div>

    <!-- Hidden: invisible but space remains; just hide, doesn't effect -->
    <div id="div5"> Visibility Hidden </div>

    <!-- Flex: flexible layout for child elements -->
    <div id="div6"> Display Flex </div> 
</body>
</html>
