<!DOCTYPE html>
<html lang="en">

<head>
    <title> Position Properties </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="box1">
        Static
        <br><br>
        Normal/default position <br>
        Position Movement Properties & Z-index doesn't work
    </div>

    <div id="box2">
        Relative
        <br><br>
        Keep the normal flow; doesn't effect position
    </div>

    <div id="box3">
        Absoulte
        <br><br>
        Positioned relative to nearest positioned parent
    </div>

    <div id="box4">
        Fixed
        <br><br>
        Stays in the same place on the screen
    </div>

    <div id="box5">
        Sticky
        <br><br>
        Acts normal, then sticks while scrolling
    </div>
</body>

</html>
