<!DOCTYPE html>
<html lang="en">

<head>
    <title> Semantic HTML </title>
    <!-- 
        Semantic elements = elements with a meaning.
     Examples of non-semantic elements: <div> and <span> - Tells nothing about its content.
     Examples of semantic elements: <img>, <table>, and <article> - Clearly defines its content.
    -->
</head>

<body>
    <header>
        <nav>
            <a href="BasicTags.html"> Basic Tags </a>
            <a href="List.html"> List </a>
            <a href="Tables.html"> Tables </a>
            <a href="Forms.html"> Forms </a>
        </nav>
    </header>

    <main>
        <div> This is Div & it's a Block Element. (Full Body Width) </div>
        <span> This is Span & it's a In-Line Element. (Only Content Width) </span>
        <article>
            <section>
                <h1> </h1>
            </section>
        </article>

        <aside> </aside>
    </main>

    <footer>
        HTML Symbols:
        &copy; <br>
        &dollar; <br>
        &reg; <br>
        &euro; <br>
        &trade; <br>
    </footer>
</body>

</html>
