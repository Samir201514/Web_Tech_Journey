<!DOCTYPE html>
<html>

<head>
    <title> HTML Task - 02 </title>
</head>

<body>
    <h1 style="text-align: center;"> Online Admission Form </h1>

    <form style="text-align: center;">
        <fieldset>
            <legend> Personal Information </legend>

            <label for="name"> Name : </label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name" required maxlength="30">
            <br> <br>
            
            <label for="age"> Age : </label>
            <input type="number" name="age" id="age" placeholder="Enter Your Age" required>
            <br> <br>

            <label for="gender"> Gender : </label>
            <input type="radio" name="gender" id="male" required> 
            <label for="male"> Male </label> 
            <input type="radio" name="gender" id="female" required>
            <label for="female"> Female </label> 
            <br> <br>

            <label for="dob"> Date of Birth : </label>
            <input type="date" name="dob" id="dob" required>
            <br> <br>

            <label for="email"> Email : </label>
            <input type="email" name="email" id="email" placeholder="Enter Your Email" required>
            <br> <br>
            
            <label for="text"> Phone : </label>
            <input type="text" name="number" id="number" placeholder="Contact Number" required maxlength="11">
            <br> <br>

            <label for="address"> Address : </label>
            <input type="text" name="number" id="address" placeholder="Enter your address" required maxlength="50">
        </fieldset>

        <br> <br>

        <fieldset>
            <legend> Academic Information </legend>
            
            <label for="dept"> Select Department : </label>
            <select id="dept" required>
                <option value=""> Select </option>
                <option value="cse"> CSE </option>
                <option value="eee"> EEE </option>
                <option value="english"> English </option>
                <option value="bba"> BBA </option>
            </select>
            <br> <br>
            
            <label for="date"> Addmission Date : </label>
            <input type="date" name="date" id="date" required>
            <br> <br>

            <label for="sInfo"> Upload Your Transcripts : </label>
            <input type="file" name="sInfo" id="sInfo" required>
            <br> <br>

            <textarea name="question" id="question" placeholder="Type your queries" rows="2" cols="30"></textarea>
        </fieldset>

        <br> <br>

        <button type="submit"> Submit </button>
        <button type="reset"> Reset </button>
    </form>

</body>

</html>
