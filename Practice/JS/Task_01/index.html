<!DOCTYPE html>
<html lang="en">
<head>
    <title> JS Task - 01 </title>
    <script src="script.js" defer></script>
</head>
<body>
    <form action="" method="" enctype="application/x-www-form-urlencoded">
        <fieldset>
            <legend> Student Portal Signup System </legend>

            <label for="name"> Full Name : </label>
            <input type="text" name="name" id="name" placeholder="Enter Your Full Name">
            <br> <span id="nameErr" style="color: red;"></span> <br>

            <label for="email"> Email : </label>
            <input type="text" name="email" id="email" placeholder="Enter Your Email Address">
            <br> <span id="emailErr" style="color: red;"></span> <br>

            <label for="password"> Password : </label>
            <input type="password" name="password" id="password" placeholder="Enter a Password">
            <br> <span id="passErr" style="color: red;"></span> <br>

            <label for="conPass"> Confirm Password : </label>
            <input type="password" name="conPass" id="conPass" placeholder="Enter Your Password again">
            <br> <span id="conPassErr" style="color: red;"></span> <br>

            <label for="phone"> Phone Number : </label>
            <input type="text" name="phone" id="phone" placeholder="Enter Your Phone Number">
            <br> <span id="phoneErr" style="color: red;"></span> <br>

            <button type="submit" id="submit" name="submit" value="submit">
                Submit
            </button>
        </fieldset>
    </form>
</body>
</html>
